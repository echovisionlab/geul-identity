name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: v1.7.11
  STATICCHECK_VERSION: v0.7.0
  DEADCODE_VERSION: v0.48.0
  HYDRA_IMAGE: oryd/hydra@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9 # v26.2.0
  GOWORK: "off"
  AUTH_HEADER_NAME: X-Geul-Authenticated-Context-B64
  INTERNAL_SERVICE_HEADER_NAME: X-Geul-Internal-Service
  SESSION_COOKIE_NAME: __Host-geul-session

jobs:
  quality:
    name: Contracts and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          npm run format:check:go
          npm run format:check:prettier

      - name: Check module integrity
        run: |
          go mod tidy -diff
          go mod verify

      - name: Validate workflows
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}" .github/workflows/*.yml

      - name: Run Go static checks
        run: |
          go vet ./...
          go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
          go run "golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}" -test ./...

      - name: Run Go tests with race detection and coverage
        run: |
          go test -race -covermode=atomic -coverpkg=./internal/oathkeeperrules -coverprofile="${RUNNER_TEMP}/coverage.out" ./...
          go tool cover -func="${RUNNER_TEMP}/coverage.out"
          total="$(go tool cover -func="${RUNNER_TEMP}/coverage.out" | awk '/^total:/ { print $3 }')"
          test "${total}" = "100.0%"

      - name: Build Go packages
        run: go build ./...

      - name: Generate and validate configuration and schemas
        run: |
          npm run check:oathkeeper-rules
          npm run generate:spicedb-schema
          npm run check:spicedb:zed

      - name: Run Node contracts and type checks
        run: |
          npm test
          npm run check:compose
          npm run check:yaml
          npm run typecheck
          npm run knip

  integration:
    name: Runtime integration
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Node dependencies
        run: npm ci

      - name: Check Compose configuration
        run: npm run check:compose

      - name: Run Hydra compatibility contract
        run: |
          set -euo pipefail
          container_name="geul-identity-hydra-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "${container_name}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          cleanup
          docker run -d --name "${container_name}" \
            -e DSN=memory \
            -e URLS_SELF_ISSUER=https://sso.example \
            -e URLS_LOGIN=https://site.example/login \
            -e URLS_CONSENT=https://site.example/consent \
            -e SECRETS_SYSTEM=0123456789abcdef0123456789abcdef \
            -e TTL_ACCESS_TOKEN=1h \
            -e TTL_REFRESH_TOKEN=720h \
            -e OAUTH2_GRANT_REFRESH_TOKEN_ROTATION_GRACE_PERIOD=0s \
            -e OAUTH2_GRANT_REFRESH_TOKEN_ROTATION_GRACE_REUSE_COUNT=0 \
            -e OIDC_DYNAMIC_CLIENT_REGISTRATION_ENABLED=true \
            -p 127.0.0.1::4444 -p 127.0.0.1::4445 \
            "${HYDRA_IMAGE}" serve all --dev >/dev/null
          public_port="$(docker port "${container_name}" 4444/tcp | awk -F: 'NR == 1 { print $NF }')"
          admin_port="$(docker port "${container_name}" 4445/tcp | awk -F: 'NR == 1 { print $NF }')"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${public_port}/health/ready" >/dev/null &&
               curl --fail --silent "http://127.0.0.1:${admin_port}/health/ready" >/dev/null; then
              TEST_HYDRA_PUBLIC_URL="http://127.0.0.1:${public_port}" \
              TEST_HYDRA_ADMIN_URL="http://127.0.0.1:${admin_port}" \
                go test -count=1 -run '^TestHydraV262RuntimeCompatibility$' ./internal/mcpoauth
              cleanup
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          docker logs "${container_name}" >&2
          exit 1

      - name: Smoke MCP OAuth facade image
        run: |
          set -euo pipefail
          facade_image="geul-identity-mcp-oauth-facade:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_name="geul-identity-mcp-oauth-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
            docker image rm -f "${facade_image}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker build --pull --no-cache --file Dockerfile.mcp-oauth-facade --tag "${facade_image}" .
          docker run -d --name "${container_name}" \
            -e MCP_OAUTH_HYDRA_PUBLIC_URL=http://127.0.0.1:4444 \
            -e MCP_OAUTH_HYDRA_ADMIN_URL=http://127.0.0.1:4445 \
            -e MCP_OAUTH_ISSUER_URL=https://issuer.example.invalid \
            -e SITE_ORIGIN=https://site.example.invalid \
            -p 127.0.0.1::8080 "${facade_image}" >/dev/null
          host_port="$(docker port "${container_name}" 8080/tcp | awk -F: 'NR == 1 { print $NF }')"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${host_port}/health/ready" >/dev/null; then
              metadata="$(curl --fail --silent --show-error "http://127.0.0.1:${host_port}/.well-known/oauth-authorization-server")"
              printf '%s' "${metadata}" | jq -e '.registration_endpoint and .client_id_metadata_document_supported == true' >/dev/null
              printf '%s' "${metadata}" | jq -e '.grant_types_supported == ["authorization_code", "refresh_token"] and .scopes_supported == ["mcp", "offline_access"]' >/dev/null
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:${host_port}/oauth2/register")"
              test "${status}" = 400
              cleanup
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          docker logs "${container_name}" >&2
          exit 1

      - name: Verify Oathkeeper authentication boundary
        run: npm run test:auth-boundary

      - name: Verify SpiceDB integration
        run: |
          npm run generate:spicedb-schema
          npm run test:spicedb
