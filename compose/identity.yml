services:
  kratos-migrate-prod:
    image: oryd/kratos@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    container_name: geul-kratos-migrate-${IDENTITY_STACK_CONTAINER_SUFFIX:-identity-prod}
    command: migrate sql up -e --yes
    environment:
      DSN: ${KRATOS_DATABASE_DSN:?KRATOS_DATABASE_DSN is required}
    restart: "no"

  kratos-prod:
    image: oryd/kratos@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    container_name: geul-kratos-${IDENTITY_STACK_CONTAINER_SUFFIX:-identity-prod}
    ports:
      - "${IDENTITY_STACK_BIND_HOST:-127.0.0.1}:${IDENTITY_STACK_KRATOS_PUBLIC_PORT:-14433}:4433"
    networks:
      default: {}
      runtime:
        aliases:
          - kratos.example.invalid
    command: serve -c /etc/config/kratos/kratos.yml
    volumes:
      - ../config/kratos:/etc/config/kratos:ro
    environment:
      <<: *kratos-environment
    restart: unless-stopped
    depends_on:
      kratos-migrate-prod:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4433/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  kratos-courier-prod:
    image: oryd/kratos@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    container_name: geul-kratos-courier-${IDENTITY_STACK_CONTAINER_SUFFIX:-identity-prod}
    networks:
      default: {}
      runtime: {}
    command: courier watch -c /etc/config/kratos/kratos.yml
    volumes:
      - ../config/kratos:/etc/config/kratos:ro
    environment:
      <<: *kratos-environment
    restart: unless-stopped
    depends_on:
      kratos-migrate-prod:
        condition: service_completed_successfully

  oathkeeper-prod:
    image: oryd/oathkeeper@sha256:467329abde34feefca217b7af76fff59e77fe1795a19376e9d479f33c7c198fc
    container_name: geul-oathkeeper-${IDENTITY_STACK_CONTAINER_SUFFIX:-identity-prod}
    ports:
      - "${IDENTITY_STACK_BIND_HOST:-127.0.0.1}:${IDENTITY_STACK_OATHKEEPER_PUBLIC_PORT:-14455}:4455"
    networks:
      default: {}
      runtime:
        aliases:
          - oathkeeper.example.invalid
    command: serve -c /etc/oathkeeper/oathkeeper.yml
    volumes:
      - ../config/oathkeeper:/etc/oathkeeper:ro
    environment:
      TOKEN_SIGNING_SECRET: ${BACKEND_TOKEN_SIGNING_SECRET:?set BACKEND_TOKEN_SIGNING_SECRET for trusted backend calls}
    restart: unless-stopped
    depends_on:
      kratos-prod:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4456/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default: {}
  runtime:
    name: ${IDENTITY_RUNTIME_NETWORK_NAME:-geul-runtime}
    external: true
